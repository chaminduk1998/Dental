# ============================================================
#  Dental Surgery Appointment Management System - configuration
#  Edit this file to match your local MySQL (WAMP default shown)
# ============================================================

# ---- HTTP server ----
# Change this if the port is already used on your machine (e.g. by XAMPP/Tomcat)
server.port=8080
# Folder that holds index.html / css / js - the frontend lives in its own
# top-level folder, as a sibling of this backend/ folder
web.root=../frontend

# ---- MySQL (Data tier) ----
db.host=localhost
db.port=3306
db.name=dental_db
db.user=root
db.password=
# Create the schema + seed data automatically on first start
db.autoInit=true

# ---- Clinic details (printed on the bill / receipt) ----
clinic.name=Sunrise Dental Clinic
clinic.address=No. 45, Hospital Road, Colombo 05
clinic.phone=011-2 555 777
clinic.taxRate=0.00

# ---- Email reminders (Observer pattern) ----
# When mail.enabled=false every reminder is stored in the `notifications`
# table and shown in the "Reminders" screen instead of being sent by SMTP.
mail.enabled=false
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.from=noreply@brightsmile.lk
mail.username=
mail.password=
